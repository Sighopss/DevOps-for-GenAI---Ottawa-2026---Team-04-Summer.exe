[project]
name = "tracevault"
version = "0.1.0"
description = "TraceVault Python SDK — emit one-flight span batches"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "jsonschema",
    "opentelemetry-api",
]

[dependency-groups]
dev = ["pytest", "bandit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
