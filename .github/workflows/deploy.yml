# Deploy from main only. OIDC (never AKIA). Skip apply if infra/ is missing.
# Rollback = re-run the last green run of this workflow (see Makefile help).

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: detect-trees
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.detect.outputs.infra }}
      web: ${{ steps.detect.outputs.web }}
      role: ${{ steps.detect.outputs.role }}
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect infra/ web/ OIDC role
        id: detect
        run: |
          if [ -d infra ]; then echo "infra=true" >> "$GITHUB_OUTPUT"; else echo "infra=false" >> "$GITHUB_OUTPUT"; fi
          if [ -d web ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$AWS_ROLE_ARN" ]; then echo "role=true" >> "$GITHUB_OUTPUT"; else echo "role=false" >> "$GITHUB_OUTPUT"; fi

  apply-dev:
    name: terraform-apply-dev
    needs: gate
    runs-on: ubuntu-latest
    environment: dev
    if: needs.gate.outputs.infra == 'true' && needs.gate.outputs.role == 'true'
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Terraform 1.9
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: terraform apply dev
        working-directory: infra
        env:
          TF_VAR_tenant_a_password: ${{ secrets.TF_VAR_TENANT_A_PASSWORD }}
          TF_VAR_tenant_b_password: ${{ secrets.TF_VAR_TENANT_B_PASSWORD }}
        run: |
          # Cognito user passwords use lifecycle.ignore_changes, so placeholders
          # satisfy required vars without rotating judge logins when secrets are unset.
          if [ -z "${TF_VAR_tenant_a_password}" ]; then
            export TF_VAR_tenant_a_password='CiPlanOnly-Aa1!'
          fi
          if [ -z "${TF_VAR_tenant_b_password}" ]; then
            export TF_VAR_tenant_b_password='CiPlanOnly-Bb1!'
          fi
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color

  apply-prod:
    name: terraform-apply-prod
    needs: [gate, apply-dev]
    runs-on: ubuntu-latest
    environment: prod
    if: needs.gate.outputs.infra == 'true' && needs.gate.outputs.role == 'true'
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Terraform 1.9
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: terraform apply prod
        working-directory: infra
        env:
          TF_VAR_tenant_a_password: ${{ secrets.TF_VAR_TENANT_A_PASSWORD }}
          TF_VAR_tenant_b_password: ${{ secrets.TF_VAR_TENANT_B_PASSWORD }}
        run: |
          if [ -z "${TF_VAR_tenant_a_password}" ]; then
            export TF_VAR_tenant_a_password='CiPlanOnly-Aa1!'
          fi
          if [ -z "${TF_VAR_tenant_b_password}" ]; then
            export TF_VAR_tenant_b_password='CiPlanOnly-Bb1!'
          fi
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color

  skip-apply:
    name: skip-apply-greenfield
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.infra != 'true' || needs.gate.outputs.role != 'true'
    steps:
      - name: Skip terraform apply
        run: |
          echo "skip: terraform apply"
          echo "infra present: ${{ needs.gate.outputs.infra }}"
          echo "AWS_ROLE_ARN present: ${{ needs.gate.outputs.role }}"
          echo "Rollback (when this workflow is green on main): re-run last successful deploy.yml"

  web:
    name: web-sync
    needs: [gate, apply-dev]
    runs-on: ubuntu-latest
    if: always() && needs.gate.outputs.web == 'true'
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: pnpm build
        working-directory: web
        run: |
          pnpm install
          pnpm build
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Setup Terraform 1.9
        if: env.AWS_ROLE_ARN != '' && needs.gate.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: s3 sync + CloudFront invalidate
        if: env.AWS_ROLE_ARN != '' && needs.gate.outputs.infra == 'true'
        working-directory: infra
        run: |
          terraform init -input=false
          BUCKET="$(terraform output -raw web_bucket)"
          DIST="$(terraform output -raw cloudfront_distribution_id)"
          aws s3 sync ../web/out "s3://${BUCKET}" --delete
          # S3 REST/OAC has no IndexDocument; without these keys /explorer(/)
          # 403/404 → custom_error_response → welcome index.html (dead CTAs).
          bash ../web/scripts/publish-explorer-cdn-keys.sh "${BUCKET}"
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/*"
      - name: Skip sync (no OIDC or infra)
        if: env.AWS_ROLE_ARN == '' || needs.gate.outputs.infra != 'true'
        run: echo "skip s3 sync / CloudFront invalidate (need AWS_ROLE_ARN + infra/)"
