# Runs Alexis's vault tests. YAML is Trevor-owned. Skip if vault/ missing.

name: vault

on:
  pull_request:
    paths:
      - "vault/**"
      - "contracts/**"
      - ".github/workflows/vault.yml"
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "contracts/**"
      - ".github/workflows/vault.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest-bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # TODO: SHA-pin

      - name: Gate — skip if vault/ missing
        id: gate
        run: |
          if [ -d vault ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: vault/ missing (greenfield)"
          fi

      - name: Setup Python 3.12
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-python@v5  # TODO: SHA-pin
        with:
          python-version: "3.12"

      - name: Install vault dependencies
        if: steps.gate.outputs.present == 'true'
        run: |
          python -m pip install -U pip
          python -m pip install pytest bandit
          if [ -f vault/requirements.txt ]; then
            python -m pip install -r vault/requirements.txt
          else
            echo "no vault/requirements.txt yet - running with test tooling only"
          fi

      - name: pytest
        if: steps.gate.outputs.present == 'true'
        run: python -m pytest vault

      # -x excludes tests: bandit B101 (assert_used) fires on every pytest
      # assert, which would red a passing suite. Application code under
      # vault/ is still scanned in full.
      - name: bandit
        if: steps.gate.outputs.present == 'true'
        run: bandit -r vault -x "*/tests/*"
