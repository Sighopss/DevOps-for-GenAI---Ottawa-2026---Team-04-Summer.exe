# Terraform fmt / init / validate on infra/**. Plan only when AWS_ROLE_ARN is set.
# OIDC â€” no AKIA in this file.

name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: fmt-validate-plan
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Gate â€” skip if infra/ missing
        id: gate
        run: |
          if [ -d infra ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: infra/ missing (greenfield)"
          fi

      - name: Setup Terraform 1.9
        if: steps.gate.outputs.present == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: IAM least-privilege + capacity guards
        if: steps.gate.outputs.present == 'true'
        run: |
          python scripts/check_iam_least_privilege.py infra/iam.tf infra/oidc.tf infra/iam_team.tf
          python -m unittest discover -s infra/tests -p 'test_*.py'

      - name: terraform fmt / init / validate
        if: steps.gate.outputs.present == 'true'
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          if grep -Rqs 'backend "' --include='*.tf' .; then
            terraform init
          else
            terraform init -backend=false
          fi
          terraform validate

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.present == 'true' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform plan
        if: steps.gate.outputs.present == 'true' && env.AWS_ROLE_ARN != ''
        working-directory: infra
        env:
          TF_VAR_tenant_a_password: ${{ secrets.TF_VAR_TENANT_A_PASSWORD }}
          TF_VAR_tenant_b_password: ${{ secrets.TF_VAR_TENANT_B_PASSWORD }}
        run: |
          # Plan needs the Cognito password vars even when secrets are empty.
          # Placeholders never land via this job — apply is deploy.yml only.
          if [ -z "${TF_VAR_tenant_a_password}" ]; then
            export TF_VAR_tenant_a_password='CiPlanOnly-Aa1!'
          fi
          if [ -z "${TF_VAR_tenant_b_password}" ]; then
            export TF_VAR_tenant_b_password='CiPlanOnly-Bb1!'
          fi
          terraform plan -input=false -no-color

      - name: Skip plan (no AWS_ROLE_ARN)
        if: steps.gate.outputs.present == 'true' && env.AWS_ROLE_ARN == ''
        run: echo "skip terraform plan (AWS_ROLE_ARN not set — OIDC placeholder)"
