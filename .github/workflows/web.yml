# Runs Michael's web tests (lint + Playwright vs fixtures). Skip if web/ missing.

name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  test:
    name: lint-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # TODO: SHA-pin

      - name: Gate — skip if web/ missing
        id: gate
        run: |
          if [ -d web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: web/ missing (greenfield)"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4  # TODO: SHA-pin
        with:
          version: 9

      - name: Setup Node 22
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4  # TODO: SHA-pin
        with:
          node-version: "22"

      - name: pnpm lint + Playwright
        if: steps.gate.outputs.present == 'true'
        working-directory: web
        run: |
          pnpm install
          pnpm lint
          pnpm exec playwright install --with-deps
          pnpm exec playwright test
