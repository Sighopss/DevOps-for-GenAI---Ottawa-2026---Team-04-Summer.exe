# Runs Michael's web tests (lint + Playwright vs fixtures). Skip if web/ missing.

name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  test:
    name: lint-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Gate â€” skip if web/ missing
        id: gate
        run: |
          if [ -d web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: web/ missing (greenfield)"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node 22
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: pnpm lint + Playwright
        if: steps.gate.outputs.present == 'true'
        working-directory: web
        run: |
          pnpm install
          pnpm lint
          pnpm exec playwright install --with-deps
          pnpm exec playwright test
